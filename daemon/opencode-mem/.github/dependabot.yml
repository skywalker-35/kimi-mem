version: 2

updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep this pin until onnxruntime ships a darwin/x64 build after the
      # macOS Ort::Env teardown fix (#27961 / #24579) and OpenCode embeds Bun >1.3.14.
      - dependency-name: "onnxruntime-node"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
